<div class="index">
  <header class="index__header">
    <span class="index__badge">{{ branchLabel }}</span>
    <h1 class="index__title">Agent Builder</h1>
    <p class="index__subtitle">Elige una herramienta para continuar</p>
  </header>

  <nav class="index__nav" aria-label="Navegación principal">
    <a class="index__item index__item--active" routerLink="/agentbuilder">
      <span class="index__item-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v18M3 12h18"/>
        </svg>
      </span>
      <span class="index__item-body">
        <span class="index__item-label">Agent Builder</span>
        <span class="index__item-desc">Diseña y edita flujos de agentes</span>
      </span>
      <span class="index__item-arrow" aria-hidden="true">→</span>
    </a>

    <div class="index__item index__item--disabled" aria-disabled="true">
      <span class="index__item-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 3v18h18"/><path d="M7 16V9"/><path d="M12 16V5"/><path d="M17 16v-3"/>
        </svg>
      </span>
      <span class="index__item-body">
        <span class="index__item-label">Monitor</span>
        <span class="index__item-desc">Próximamente</span>
      </span>
    </div>
  </nav>
</div>
