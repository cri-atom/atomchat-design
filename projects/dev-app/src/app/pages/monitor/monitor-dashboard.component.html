<div class="dashboard">
  <div class="dashboard__toolbar">
    <app-monitor-segmented-control [options]="timeOptions" [(value)]="timeRange" />
  </div>

  <div class="dashboard__kpis">
    @for (kpi of kpis; track kpi.title) {
      <app-monitor-kpi-card [kpi]="kpi" />
    }
  </div>

  <section class="dashboard__card dashboard__card--wide">
    <h2 class="dashboard__card-title">Latencia en los últimos 7 días</h2>
    <app-monitor-line-chart [height]="embedded() ? '100px' : '160px'" />
  </section>

  <div class="dashboard__row-2">
    <section class="dashboard__card">
      <h2 class="dashboard__card-title">Costo por modelo</h2>
      <app-monitor-bar-chart />
    </section>
    <section class="dashboard__card">
      <h2 class="dashboard__card-title">Motivos de cierre</h2>
      <app-monitor-doughnut-chart />
    </section>
  </div>
</div>
