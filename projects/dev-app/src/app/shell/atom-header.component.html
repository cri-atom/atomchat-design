<header class="atom-header">
  <div class="atom-header__logo" aria-hidden="true">
    <svg viewBox="0 0 138 35" width="137" height="35" fill="none">
      <text
        x="0"
        y="26"
        font-family="Inter, sans-serif"
        font-size="22"
        font-weight="700"
        fill="#18181B"
      >
        ATOM
      </text>
    </svg>
  </div>

  <div class="atom-header__user">
    <span class="atom-header__user-name">{{ userName }}</span>
    <div class="atom-header__avatar" aria-hidden="true">{{ userInitials }}</div>
  </div>
</header>
