<div class="edges-tab__section">
  <h3 class="edges-tab__section-title">{{ 'tabs.edges.condition_label' | transloco }}</h3>
  <mat-form-field appearance="outline" class="edges-tab__field" subscriptSizing="dynamic">
    <input matInput type="text" [ngModel]="edge().data.label" (ngModelChange)="update({ label: $event })" [placeholder]="'tabs.edges.condition_label_placeholder' | transloco" />
  </mat-form-field>
</div>

<div class="edges-tab__section">
  <h3 class="edges-tab__section-title">{{ 'tabs.edges.condition_expression' | transloco }}</h3>
  <mat-form-field appearance="outline" class="edges-tab__field" subscriptSizing="dynamic">
    <textarea matInput rows="4" [ngModel]="edge().data.conditionExpression" (ngModelChange)="update({ conditionExpression: $event })"
      [placeholder]="'tabs.edges.condition_expression_placeholder' | transloco"></textarea>
  </mat-form-field>
</div>
